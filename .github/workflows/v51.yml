name: V5.1 acceptance

on:
  pull_request:
  push:
    branches: [main, codex/ui-final-polish-acceptance]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: PYTHONUTF8=1 python -m uvicorn apps.api.main:app --host 127.0.0.1 --port 8101 > /tmp/smp-api.log 2>&1 &
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: SMP_API_BASE=http://127.0.0.1:8101 npm run dev -- -p 3111 > /tmp/smp-web.log 2>&1 &
        working-directory: apps/web
      - run: npx playwright test e2e/v51-regression.spec.ts --project=reference-1672x941 --workers=1
        working-directory: apps/web
        env:
          SMP_WEB_BASE: http://127.0.0.1:3111

  visual-regression:
    runs-on: ubuntu-latest
    needs: [frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run dev -- -p 3111 > /tmp/smp-web.log 2>&1 &
        working-directory: apps/web
      - run: npx playwright test e2e/visual-reference.spec.ts --project=reference-1672x941 --workers=1
        working-directory: apps/web
        env:
          SMP_WEB_BASE: http://127.0.0.1:3111
      - run: npm run visual:diff
        working-directory: apps/web
