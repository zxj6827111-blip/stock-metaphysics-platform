name: V5.1 acceptance

on:
  pull_request:
  push:
    branches: [main, codex/ui-final-polish-acceptance]

jobs:
  # Python 核心套件：不含需要已构建 node 紫微服务的 ziwei_live 用例
  # （那些在 ziwei-engine-golden job 里带真实服务运行），
  # 这样"某个 node 服务没构建"不会再表现为整套 Python 测试含混的 skip/fail。
  backend-core:
    name: backend core (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q -m "not ziwei_live"
      - name: Collect pytest failure cache
        if: always()
        run: mkdir -p ci-logs && cp .pytest_cache/v/cache/lastfailed ci-logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-pytest-logs
          if-no-files-found: ignore
          path: ci-logs/**

  # 紫微相关：先构建 node 服务，再断言通道真实可用，最后跑引擎/因子/golden/交叉核对
  ziwei-engine-golden:
    name: ziwei engine + golden (node services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Build production ziwei service
        run: npm ci --no-fund --no-audit && npm run build
        working-directory: services/ziwei-service
      - name: Install reference ziwei service deps
        # reference 服务的 package-lock.json 按仓库约定不入库（见 .gitignore），
        # 依赖在 package.json 中是精确版本（fortel-ziweidoushu@1.3.4），因此用 npm install。
        run: npm install --no-fund --no-audit
        working-directory: services/ziwei-reference-service
      - name: Assert node channels are really available (no silent skip)
        run: |
          python - <<'PY'
          from src.engines.ziwei.transport import SubprocessZiweiTransport
          from src.engines.ziwei.reference import reference_status

          production = SubprocessZiweiTransport()
          assert production.available(), production.describe()
          reference = reference_status()
          assert reference.available, reference.detail
          print("ziwei production:", production.describe())
          print("ziwei reference:", reference.detail)
          PY
      - run: >
          python -m pytest -q
          tests/engines/test_ziwei_engine.py
          tests/factors/test_ziwei_factors.py
          tests/golden/test_ziwei_golden.py
          tests/golden/test_ziwei_cross_engine.py

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  # 端到端：确定性种子库（不访问真实行情网络）+ 显式 readiness gate（不靠 retries 掩盖竞态）
  frontend-e2e:
    name: frontend e2e (seeded date-scan)
    runs-on: ubuntu-latest
    env:
      SMP_DATABASE_URL: sqlite:////tmp/smp-e2e.sqlite3
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Seed deterministic CI database
        run: python scripts/ci_seed_date_scan.py
      - name: Start API
        run: python -m uvicorn apps.api.main:app --host 127.0.0.1 --port 8101 > /tmp/smp-api.log 2>&1 &
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Start web
        run: SMP_API_BASE=http://127.0.0.1:8101 npm run dev -- -p 3111 > /tmp/smp-web.log 2>&1 &
        working-directory: apps/web
      - name: Wait for API readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8101/api/v1/system/health >/dev/null; then
              echo "api ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API 未在 60s 内就绪"; tail -200 /tmp/smp-api.log; exit 1
      - name: Wait for web readiness
        run: |
          for i in $(seq 1 120); do
            if curl -fsS -o /dev/null http://127.0.0.1:3111/research/date-scan; then
              echo "web ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Web 未在 120s 内就绪"; tail -200 /tmp/smp-web.log; exit 1
      - name: Run e2e (v5.1 + date-scan v3)
        run: npx playwright test e2e/v51-regression.spec.ts e2e/date-scan-v3.spec.ts --project=reference-1672x941 --workers=1
        working-directory: apps/web
        env:
          SMP_WEB_BASE: http://127.0.0.1:3111
          SMP_E2E_SEEDED: "1"
      - name: Server logs on failure
        if: failure()
        run: |
          echo "=== api log ==="; tail -200 /tmp/smp-api.log || true
          echo "=== web log ==="; tail -200 /tmp/smp-web.log || true
      - name: Collect CI evidence
        if: always()
        run: |
          mkdir -p ci-logs
          cp /tmp/smp-api.log ci-logs/smp-api.log 2>/dev/null || true
          cp /tmp/smp-web.log ci-logs/smp-web.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          if-no-files-found: ignore
          path: |
            apps/web/test-results/**
            apps/web/playwright-report/**
            ci-logs/**

  # 视觉结构回归（V3-B0）：**生产构建**上的几何与真实性门禁。
  #
  # 为什么必须独立成一个 job，而不是往 frontend-e2e 里加两行：
  #   1. `frontend-e2e` 跑的是 `npm run dev`。dev 会注入 Next 开发指示器、
  #      hydration 行为也不同 —— 在它上面宣称"production parity"是假的
  #      （docs/UI_INDEPENDENT_REVIEW_2026-09-22.md §五、docs/UI_VISUAL_PARITY_V5.md 固定环境）。
  #   2. 那个 job 只跑 v51-regression + date-scan-v3，**不覆盖** V3-A/V3-B 的几何门。
  #      所以"5/5 green"从来不代表首屏层级没退化（V3-A.1 复核时明确记录了这一点）。
  #   3. 本 job 全程 fixture 模式，不连后端、不碰真实行情网络：
  #      几何门要的是可复现的 DOM，不是研究数据。
  #
  # 与 frontend-e2e 并存，不替换、不缩小它的作用域。
  frontend-ui-structure:
    name: frontend UI structure (production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # 生产构建 + next start 到独立端口 3112（不复用 3111，避免与 seeded e2e job 抢端口）
      - run: npm run build
        working-directory: apps/web
      - name: Start production web
        run: npx next start -p 3112 > /tmp/smp-web-structure.log 2>&1 &
        working-directory: apps/web
      # 显式 readiness：按目标路由的真实状态码等，不用固定 sleep 掩盖竞态
      - name: Wait for web readiness
        run: |
          for i in $(seq 1 120); do
            if curl -fsS -o /dev/null "http://127.0.0.1:3112/stock/600519/backtest?fixture=ui-reference"; then
              echo "web ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Web 未在 120s 内就绪"; tail -200 /tmp/smp-web-structure.log; exit 1
      - name: Run UI structure gates (geometry + truthfulness + 1440)
        run: >
          npx playwright test
          e2e/v3a-backtest.spec.ts
          e2e/v3b-visual.spec.ts
          e2e/viewport-1440-pages.spec.ts
          e2e/r1-refinement.spec.ts
          e2e/ui-parity-r1.spec.ts
          --project=reference-1672x941
          --workers=1
        working-directory: apps/web
        env:
          SMP_WEB_BASE: http://127.0.0.1:3112
      - name: Server log on failure
        if: failure()
        run: |
          echo "=== production web log ==="; tail -200 /tmp/smp-web-structure.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-structure-artifacts
          if-no-files-found: ignore
          path: |
            apps/web/test-results/**
            apps/web/playwright-report/**

  # 视觉回归已在 2026-09-23 明确移出 PR #3 的 CI scope（非"通过"，是"推迟"）：
  # 门禁工具链原样保留 —— doc/ui-reference/*.png、apps/web/scripts/visual-diff.mjs、
  # apps/web/e2e/visual-reference.spec.ts、docs/UI_VISUAL_PARITY_V5.md（真实 FAIL 数据未动）。
  # 待专门的 ui-visual-parity 分支推进 parity 后再以独立 job 恢复。
