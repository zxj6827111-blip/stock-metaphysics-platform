name: V5.1 acceptance

on:
  pull_request:
  push:
    branches: [main, codex/ui-final-polish-acceptance]

jobs:
  # Python 核心套件：不含需要已构建 node 紫微服务的 ziwei_live 用例
  # （那些在 ziwei-engine-golden job 里带真实服务运行），
  # 这样"某个 node 服务没构建"不会再表现为整套 Python 测试含混的 skip/fail。
  backend-core:
    name: backend core (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q -m "not ziwei_live"
      - name: Collect pytest failure cache
        if: always()
        run: mkdir -p ci-logs && cp .pytest_cache/v/cache/lastfailed ci-logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-pytest-logs
          if-no-files-found: ignore
          path: ci-logs/**

  # 紫微相关：先构建 node 服务，再断言通道真实可用，最后跑引擎/因子/golden/交叉核对
  ziwei-engine-golden:
    name: ziwei engine + golden (node services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Build production ziwei service
        run: npm ci --no-fund --no-audit && npm run build
        working-directory: services/ziwei-service
      - name: Install reference ziwei service deps
        run: npm ci --no-fund --no-audit
        working-directory: services/ziwei-reference-service
      - name: Assert node channels are really available (no silent skip)
        run: |
          python - <<'PY'
          from src.engines.ziwei.transport import SubprocessZiweiTransport
          from src.engines.ziwei.reference import reference_status

          production = SubprocessZiweiTransport()
          assert production.available(), production.describe()
          reference = reference_status()
          assert reference.available, reference.detail
          print("ziwei production:", production.describe())
          print("ziwei reference:", reference.detail)
          PY
      - run: >
          python -m pytest -q
          tests/engines/test_ziwei_engine.py
          tests/factors/test_ziwei_factors.py
          tests/golden/test_ziwei_golden.py
          tests/golden/test_ziwei_cross_engine.py

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  # 端到端：确定性种子库（不访问真实行情网络）+ 显式 readiness gate（不靠 retries 掩盖竞态）
  frontend-e2e:
    name: frontend e2e (seeded date-scan)
    runs-on: ubuntu-latest
    env:
      SMP_DATABASE_URL: sqlite:////tmp/smp-e2e.sqlite3
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Seed deterministic CI database
        run: python scripts/ci_seed_date_scan.py
      - name: Start API
        run: python -m uvicorn apps.api.main:app --host 127.0.0.1 --port 8101 > /tmp/smp-api.log 2>&1 &
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Start web
        run: SMP_API_BASE=http://127.0.0.1:8101 npm run dev -- -p 3111 > /tmp/smp-web.log 2>&1 &
        working-directory: apps/web
      - name: Wait for API readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8101/api/v1/system/health >/dev/null; then
              echo "api ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API 未在 60s 内就绪"; tail -200 /tmp/smp-api.log; exit 1
      - name: Wait for web readiness
        run: |
          for i in $(seq 1 120); do
            if curl -fsS -o /dev/null http://127.0.0.1:3111/research/date-scan; then
              echo "web ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Web 未在 120s 内就绪"; tail -200 /tmp/smp-web.log; exit 1
      - name: Run e2e (v5.1 + date-scan v3)
        run: npx playwright test e2e/v51-regression.spec.ts e2e/date-scan-v3.spec.ts --project=reference-1672x941 --workers=1
        working-directory: apps/web
        env:
          SMP_WEB_BASE: http://127.0.0.1:3111
          SMP_E2E_SEEDED: "1"
      - name: Server logs on failure
        if: failure()
        run: |
          echo "=== api log ==="; tail -200 /tmp/smp-api.log || true
          echo "=== web log ==="; tail -200 /tmp/smp-web.log || true
      - name: Collect CI evidence
        if: always()
        run: |
          mkdir -p ci-logs
          cp /tmp/smp-api.log ci-logs/smp-api.log 2>/dev/null || true
          cp /tmp/smp-web.log ci-logs/smp-web.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          if-no-files-found: ignore
          path: |
            apps/web/test-results/**
            apps/web/playwright-report/**
            ci-logs/**

  # 视觉回归：门禁阈值与 reference 真值一律不改（红灯必须如实保留）
  visual-regression:
    runs-on: ubuntu-latest
    needs: [frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Start web
        run: npm run dev -- -p 3111 > /tmp/smp-web.log 2>&1 &
        working-directory: apps/web
      - name: Wait for web readiness
        run: |
          for i in $(seq 1 120); do
            if curl -fsS -o /dev/null http://127.0.0.1:3111/; then
              echo "web ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Web 未在 120s 内就绪"; tail -200 /tmp/smp-web.log; exit 1
      - run: npx playwright test e2e/visual-reference.spec.ts --project=reference-1672x941 --workers=1
        working-directory: apps/web
        env:
          SMP_WEB_BASE: http://127.0.0.1:3111
      - run: npm run visual:diff
        working-directory: apps/web
      - name: Collect CI evidence
        if: always()
        run: |
          mkdir -p ci-logs
          cp /tmp/smp-web.log ci-logs/smp-web.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-artifacts
          if-no-files-found: ignore
          path: |
            apps/web/test-results/visual-reference/**
            ci-logs/**
