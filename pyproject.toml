[project]
name = "stock-metaphysics-platform"
version = "0.1.0"
description = "Stock Metaphysics Multi-Model Research Platform — Phase 1 (Foundation & BaZi Research Loop)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # --- web / api ---
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    # --- persistence ---
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    # --- research / data ---
    # pandas 锁在 2.x：3.x 存在大量 breaking change，Phase 1 不冒险升级
    "numpy==2.5.3",
    "pandas>=2.3,<3.0",
    "pyarrow==25.0.1",
    "duckdb==1.5.5",
    # --- third-party metaphysics (adapter-only) ---
    "lunar-python==1.4.8",
    # --- market data (adapter-only) ---
    "akshare==1.18.96",
    # --- knowledge retrieval ---
    "jieba==0.42.1",
    "rank-bm25==0.2.2",
    # --- infra ---
    "tenacity==9.1.4",
    "httpx==0.28.1",
    "orjson==3.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.14.13",
]

[project.scripts]
smp-api = "apps.api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "apps"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "golden: golden case regression tests",
    "slow: slow tests (network / large computation)",
    "network: requires network access",
    "integration: API / 端到端集成测试",
    "acceptance: 验收专项测试",
    "ziwei_live: 需要本机可运行 services/ziwei-service（node + iztro）",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501", # 行宽由人工控制
    "B008", # FastAPI 依赖注入惯用法需要函数调用当默认值
    # UP042: `class X(str, Enum)` 是本项目刻意的 JSON 友好枚举模式
    # （使枚举值在 Pydantic/JSON 序列化中表现为字符串）；这是 FastAPI 生态的官方惯例，
    # 不是"可替代的写法"。
    "UP042",
]
